name: Build and deploy Docker image to Azure Web App - findmyflight-backend-prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DCD8876355A34270B555F6449389B300 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B21D10D3B5EB4D64B08D2EEA2A6C036C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5E07074C198457495E113501B68EB9D }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/findmyflight-backend:${{ github.sha }}
          LATEST=${{ secrets.ACR_NAME }}.azurecr.io/findmyflight-backend:latest
          docker build -t $IMAGE -t $LATEST .
          docker push $IMAGE
          docker push $LATEST

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'findmyflight-backend-prod'
          slot-name: 'Production'
          images: '${{ secrets.ACR_NAME }}.azurecr.io/findmyflight-backend:${{ github.sha }}'

          